<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Ambika Store</title>

<link rel="stylesheet" href="style.css">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>

<body>

<header class="header">

<div class="logo">
🛒 Ambika Store
</div>

<div class="search-box">
<input id="search" type="text" placeholder="Search products...">
</div>

<div class="cart">
🛍️ <span id="cartCount">0</span>
</div>

</header>

<section class="hero">

<h1>Welcome to Ambika Store</h1>

<p>Your Trusted Grocery Store</p>

</section>

<!-- Categories -->

<section class="categories">

<button class="cat active">All</button>
<button class="cat">Oil</button>
<button class="cat">Rice</button>
<button class="cat">Dal</button>
<button class="cat">Sugar</button>
<button class="cat">Atta</button>

</section>

<section>

<h2 class="title">Today's Grocery</h2>

<div id="products" class="products"></div>

</section>
<div id="cartPanel" class="cart-panel">

<div class="cart-header">

<h2>🛒 Your Cart</h2>

<button id="closeCart">✖</button>

</div>

<div id="cartItems"></div>

<div class="bill">

<p>Subtotal <span id="subtotal">₹0</span></p>

<p>Delivery <span>₹0</span></p>

<hr>

<h2>Total <span id="total">₹0</span></h2>

<button id="checkout">
Proceed to WhatsApp
</button>

</div>

</div>


<script src="script.js"></script>

</body>
</html>
